name: build-pdfs
on:
  push:
    paths: ["**.tex"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile syllabus + lecture notes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            syllabus/syllabus.tex
            lectures/P1-groups.tex
            lectures/P2-topology.tex
            lectures/P3-algtop.tex
            lectures/S1-rings.tex
          latexmk_use_pdflatex: true

      - name: Commit generated PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f syllabus/*.pdf lectures/*.pdf
          git diff --cached --quiet || git commit -m "build: refresh PDFs [skip ci]"
          git push