</div>
<script id="submission-cfg" type="application/json">{"backend": "supabase", "supabase": {"url": "https://vusnkdhvbolgwgrqbsrf.supabase.co", "anon_key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1c25rZGh2Ym9sZ3dncnFic3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDQwNTAsImV4cCI6MjEwNTY4MDA1MH0.8jJH8nEY70b6so1liHL--10IEk4RzOkDP5RUw6-ir0E"}, "firebase": {"apiKey": "...", "authDomain": "...", "projectId": "...", "storageBucket": "...", "messagingSenderId": "...", "appId": "..."}, "session_ids": ["P0", "P1", "P2", "P3", "S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8", "S9", "S10", "S11", "S12", "S13", "S14", "S15", "S16", "S17", "S18", "S19", "S20", "S21", "S22", "S23", "S24", "S25", "S26", "S27", "S28", "S29", "S30", "S31", "S32", "S33", "S34", "S35", "S36", "S37", "S38", "S39", "S40", "S41", "S42", "S43", "S44", "S45", "S46", "S47", "S48", "S49", "S50", "S51", "S52", "S53", "S54", "S55", "S56", "S57", "S58", "S59", "S60", "S61"]}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>/*submissions-list-js*/
(function(){
const CFG = JSON.parse(document.getElementById('submission-cfg').textContent);
let sb=null, fb=null;
if (CFG.backend==='supabase') sb=supabase.createClient(CFG.supabase.url, CFG.supabase.anon_key);
if (CFG.backend==='firebase'){ firebase.initializeApp(CFG.firebase); fb=firebase.firestore(); }
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pubUrl=f=>f.url||(f.bucket==='solutions-public'?CFG.supabase.url+'/storage/v1/object/public/'+f.bucket+'/'+f.path:null);
async function load(){
  let rows=[];
  if (CFG.backend==='supabase'){
    const r=await sb.from('submissions').select('*').eq('is_public',true).limit(300);
    if (r.error) throw new Error(r.error.message);
    rows=r.data.map(x=>({t:x.created_at,session:x.session,name:x.name,solution:x.solution,files:x.files||[]}));
  } else {
    const snap=await fb.collection('submissions').where('isPublic','==',true).limit(300).get();
    snap.forEach(d=>{const x=d.data();rows.push({t:new Date(x.createdAt||0).toISOString(),session:x.session,name:x.name,solution:x.solution,files:x.files||[]});});
  }
  rows.sort((a,b)=> (b.t||'').localeCompare(a.t||''));
  const tb=document.getElementById('subsBody');
  tb.innerHTML = rows.length ? rows.map(r=>
    '<tr><td>'+esc(r.session)+'</td><td>'+esc(r.name||'Anonymous')+'</td><td>'+esc((r.solution||'').slice(0,120))+'</td><td>'+
    (r.files.map(f=>{const u=pubUrl(f);return u?'<a href="'+esc(u)+'" target="_blank">'+esc(f.name)+'</a>':esc(f.name)+' (private)';}).join('<br>')||'—')+
    '</td><td>'+esc((r.t||'').slice(0,10))+'</td></tr>').join('')
    : '<tr><td colspan="5"><em>No public submissions yet.</em></td></tr>';
}
load().catch(e=>{document.getElementById('subsBody').innerHTML='<tr><td colspan="5">Error: '+esc(e.message)+'</td></tr>';});
})();
</script>
</body></html>
